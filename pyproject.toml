[project]
name = "vigia"
version = "0.1.0"
description = "Laboratório de RAG híbrido, agentes, MCP e A2A para normas internas."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "qdrant-client>=1.12",
  "httpx>=0.27",
  "pyyaml>=6",
  "fastembed>=0.4",
]

[project.optional-dependencies]
semantic = ["fastembed>=0.4"]
cloud = ["google-genai>=1.0"]
dev = ["pytest>=8"]

[project.scripts]
vigia = "vigia.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = [
  "ignore:Using `httpx` with `starlette.testclient`:DeprecationWarning",
]
